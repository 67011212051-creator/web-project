<div class="mock-map" [style.height]="height">
  <div class="map-bg">
    <div class="park"></div>
    <div class="road road-h1"></div>
    <div class="road road-h2"></div>
    <div class="road road-v1"></div>
    <div class="road road-v2"></div>
    @if (radiusCircle) {
      <div class="radius-circle"></div>
    }
  </div>

  @if (routes.length) {
    <svg class="route-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      @for (r of routes; track r.color) {
        <polyline [attr.points]="pointsToSvg(r.points)" [attr.stroke]="r.color" fill="none" stroke-width="1.4" stroke-linecap="round" />
      }
    </svg>
  }

  @for (m of markers; track m.id) {
    <div
      class="marker"
      [class.home]="m.isHome"
      [style.left.%]="m.x"
      [style.top.%]="m.y"
      [style.background]="m.isHome ? '#1c1c1c' : (m.color || '#f5a623')"
    >
      @if (!m.isHome) { {{ m.id }} }
      @else { 🏠 }
    </div>
  }
</div>
