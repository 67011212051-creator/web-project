<div class="modal-overlay">
  <div class="modal">
    <h2>เพิ่มลูกค้า</h2>
    <p class="sub">กรอกข้อมูลที่จำเป็นสำหรับจัดส่งและวางแผนเส้นทาง</p>

    <div class="field">
      <label>ชื่อลูกค้า *</label>
      <input type="text" value="คุณสมหญิง ใจดี" placeholder="เช่น คุณสมหญิง ใจดี" />
    </div>

    <div class="field">
      <label>เบอร์โทรศัพท์ *</label>
      <input type="text" value="089-245-7812" placeholder="0XX-XXX-XXXX" />
      <div class="hint">กรอกหมายเลข 10 หลัก</div>
    </div>

    <div class="field">
      <label>ที่อยู่ / รายละเอียดจุดส่ง *</label>
      <input type="text" value="หมู่บ้านเอื้ออาทร ท่าขอนยาง" placeholder="บ้านเลขที่ หมู่บ้าน อาคาร หรือจุดสังเกต" />
      <div class="hint">ระบุรายละเอียดให้ไรเดอร์ค้นหาจุดส่งได้ง่าย</div>
    </div>

    <div class="field">
      <label>ละติจูด *</label>
      <input type="text" value="16.2458" placeholder="16.2467" />
    </div>

    <div class="field">
      <label>ลองจิจูด *</label>
      <input type="text" value="103.2506" placeholder="103.2519" />
    </div>

    <div class="map-preview">
      <div class="pin">📍</div>
    </div>
    <button class="btn btn-secondary loc-btn">◎ ใช้ตำแหน่งปัจจุบัน</button>

    <div class="hint required-hint">* จำเป็นต้องระบุ เบอร์โทร ที่อยู่ และพิกัดให้ครบ</div>

    <div class="modal-actions">
      <button class="btn btn-secondary">ยกเลิก</button>
      <button class="btn btn-primary">บันทึกลูกค้า</button>
    </div>
  </div>
</div>
