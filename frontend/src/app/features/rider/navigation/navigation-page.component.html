<div class="phone-shell">
  @if (stop(); as s) {
    <div class="topbar">
      <a [routerLink]="['/rider/job', jobCode()]" class="back-link">‹ กลับไปดูใบงาน</a>
      <div class="topbar-tag">รอบเที่ยง</div>
    </div>

    <div class="pin-info">
      <span class="pin-dot"></span> ตำแหน่งปัจจุบัน · หน้าร้าน LunchFlow
    </div>

    <app-mock-map
      height="360px"
      [markers]="[
        { id: 'home', x: 50, y: 60, isHome: true },
        { id: s.seq, x: 30 + s.seq * 20, y: 20 + s.seq * 5, color: '#f5a623' }
      ]"
      [routes]="[{ color: '#2e6ff2', points: [{x: 20, y: 90}, {x: 50, y: 60}, {x: 30 + s.seq * 20, y: 20 + s.seq * 5}] }]"
    ></app-mock-map>

    <div class="content">
      <div class="stop-progress">จุดส่งถัดไป · {{ stopIndex() + 1 }}/{{ totalStops() }}</div>
      <div class="stop-eta">ETA {{ s.etaText }}</div>

      <div class="customer-name">{{ s.customerName }} · {{ s.boxCount }} กล่อง</div>
      <div class="customer-address">{{ s.address }}</div>

      <a [href]="'tel:' + s.phone" class="btn btn-outline call-btn">☎ โทร</a>

      <button class="btn btn-primary btn-block" (click)="markDelivered()">
        {{ s.delivered ? '✓ ถึงจุดส่งแล้ว' : 'ถึงจุดส่งแล้ว' }}
      </button>
    </div>
  } @else {
    <div class="content">
      <p>ไม่พบข้อมูลจุดส่งนี้</p>
      <a [routerLink]="['/rider/job', jobCode()]" class="btn btn-outline">กลับไปดูใบงาน</a>
    </div>
  }
</div>
