<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-title">เพิ่มลูกค้า</div>
    <div class="modal-subtitle">กรอกข้อมูลที่จำเป็นสำหรับจัดส่งและวางแผนเส้นทาง</div>

    <div class="field">
      <label>ชื่อลูกค้า *</label>
      <input type="text" [(ngModel)]="name" placeholder="เช่น คุณสมหญิง ใจดี" />
    </div>

    <div class="field">
      <label>เบอร์โทรศัพท์ *</label>
      <input type="text" [(ngModel)]="phone" placeholder="0XX-XXX-XXXX" />
      <div class="hint">กรอกหมายเลข 10 หลัก</div>
    </div>

    <div class="field">
      <label>ที่อยู่ / รายละเอียดจุดส่ง *</label>
      <input type="text" [(ngModel)]="address" placeholder="บ้านเลขที่ หมู่บ้าน อาคาร หรือจุดสังเกต" />
      <div class="hint">ระบุรายละเอียดให้ไรเดอร์ค้นหาจุดส่งได้ง่าย</div>
    </div>

    <div class="field">
      <label>ละติจูด *</label>
      <input type="text" [(ngModel)]="lat" />
    </div>
    <div class="field">
      <label>ลองจิจูด *</label>
      <input type="text" [(ngModel)]="lng" />
    </div>

    <app-mock-map
      height="220px"
      [markers]="[{ id: 'p', x: 50, y: 50 }]"
    ></app-mock-map>
    <button class="btn btn-outline" style="margin-top:10px;" (click)="useCurrentLocation()">📍 ใช้ตำแหน่งปัจจุบัน</button>

    <div class="hint" style="margin-top:14px; color:#c0392b;">* จำเป็นต้องระบุ ชื่อ เบอร์โทร ที่อยู่ และพิกัดให้ครบ</div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="close.emit()">ยกเลิก</button>
      <button class="btn btn-primary" (click)="onSave()">บันทึกลูกค้า</button>
    </div>
  </div>
</div>
