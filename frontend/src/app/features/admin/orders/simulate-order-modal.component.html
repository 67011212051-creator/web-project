<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-title">จำลองออเดอร์</div>
    <div class="modal-subtitle">สร้างชุดออเดอร์ตัวอย่างเพื่อทดสอบการจัดเส้นทาง</div>

    <div class="field">
      <label>เลือกลูกค้า / ค้นหา *</label>
      <input type="text" placeholder="ค้นหาชื่อหรือเบอร์โทร" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
    </div>

    <div class="radio-option selected">
      <input type="radio" checked readonly />
      สุ่มลูกค้าจากรายชื่อทั้งหมด
    </div>

    <div class="field">
      <label>จำนวนออเดอร์จำลอง</label>
      <input type="text" [ngModel]="orderCount()" (ngModelChange)="orderCount.set(+$event)" />
      <div class="hint">ช่วงแนะนำ 20–30 ออเดอร์</div>
    </div>

    <div class="field">
      <label>จำนวนกล่องต่อออเดอร์</label>
      <input type="text" value="สุ่ม 1–3 กล่อง" readonly />
      <div class="hint">สูงสุด 3 กล่อง</div>
    </div>

    <div class="field">
      <label>เวลาสั่ง</label>
      <input type="text" value="10:30–11:25 น." readonly />
    </div>

    <div class="field">
      <label>กำหนดส่ง *</label>
      <input type="text" [ngModel]="deadline()" (ngModelChange)="deadline.set($event)" />
    </div>

    <div class="info-box">
      <b>ระบบจะสร้างออเดอร์จำลอง {{ orderCount() }} รายการ</b>
      สุ่มลูกค้า เวลา และจำนวน 1–3 กล่อง พร้อมสถานะ "รอจัดเส้นทาง" โดยไม่กระทบออเดอร์จริง
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="close.emit()">ยกเลิก</button>
      <button class="btn btn-primary" (click)="onStart()">เริ่มจำลอง</button>
    </div>
  </div>
</div>
